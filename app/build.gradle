plugins {
    id 'com.android.application'
}

// Signing credentials live in keystore.properties (git-ignored). When the file or
// keystore is absent (e.g. CI without secrets), fall back to debug signing so the
// build still produces an installable APK.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def releaseKeystore = rootProject.file('release.keystore')

android {
    namespace 'com.example.nitzpriority'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.nitzpriority'
        minSdk 26
        targetSdk 35
        versionCode 36
        versionName '1.35'

        // Build identity for the in-app update check (UpdateChecker): the
        // commit this APK was built from and the build time. The app
        // compares the build time with the `latest` release asset's
        // updated_at on GitHub; a newer asset means a rebuild happened
        // after this APK was built. "unknown" when git is unavailable.
        def gitSha = "unknown"
        try {
            gitSha = "git rev-parse --short HEAD".execute().text.trim()
            if (gitSha.isEmpty()) gitSha = "unknown"
        } catch (Throwable ignored) {
            gitSha = "unknown"
        }
        resValue "string", "app_build_git_sha", gitSha
        resValue "string", "app_build_time_millis",
            String.valueOf(System.currentTimeMillis())
    }

    signingConfigs {
        release {
            storeFile releaseKeystore
            // The release keystore is PKCS#12 (generated with openssl);
            // the default JKS type cannot read it.
            storeType 'PKCS12'
            storePassword keystoreProps.getProperty('storePassword')
            keyAlias keystoreProps.getProperty('keyAlias', 'nitzpriority')
            keyPassword keystoreProps.getProperty('keyPassword')
        }
    }

    buildTypes {
        release {
            // Minification must stay off: the Xposed entry class is loaded reflectively.
            minifyEnabled false
            signingConfig (releaseKeystore.exists() && keystoreProps.getProperty('storePassword')
                ? signingConfigs.release : signingConfigs.debug)
        }
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
