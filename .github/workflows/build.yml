name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 35
        run: sdkmanager "platforms;android-35"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      # Optional release signing: configure repository secrets RELEASE_KEYSTORE_BASE64,
      # RELEASE_STORE_PASSWORD and RELEASE_KEY_PASSWORD to produce a release-signed APK.
      # Without them the build falls back to debug signing.
      - name: Restore release keystore from secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore
            {
              echo "storePassword=${{ secrets.RELEASE_STORE_PASSWORD }}"
              echo "keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}"
            } > keystore.properties
            echo "Release signing enabled."
          else
            echo "No keystore secrets; debug signing fallback."
          fi

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: satellite-time-apk
          path: app/build/outputs/apk/release/*.apk
